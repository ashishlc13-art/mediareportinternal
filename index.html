<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGO Project Report | Dimag Ghochne Manche</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* COLOR PALETTE DERIVED FROM DGO LOGO */
        :root {
            --dgo-purple: #9c4cf4;
            --dgo-pink: #eb4bb4;
            --dgo-red: #ff3d3d;
            --dgo-gradient: linear-gradient(135deg, #9c4cf4, #eb4bb4, #ff3d3d);
            --bg-page: #f8fafc;
            --text-main: #1e293b;
            --text-light: #64748b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #fdf2f8, #f5f3ff, var(--bg-page));
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .report-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 40px 100px -20px rgba(156, 76, 244, 0.15);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* LOGO HEADER AREA */
        header {
            padding: 60px 40px;
            text-align: center;
            background: linear-gradient(180deg, rgba(156, 76, 244, 0.05) 0%, transparent 100%);
        }

        .main-logo {
            width: 320px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            margin-bottom: 40px;
        }

        .meta-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            text-align: left;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        .meta-box h6 {
            margin: 0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--dgo-purple);
            font-weight: 800;
        }

        .meta-box p {
            margin: 5px 0 0;
            font-weight: 600;
            color: var(--text-main);
            font-size: 15px;
        }

        /* SECTION STYLING */
        .body-content {
            padding: 40px 60px;
        }

        h2 {
            font-size: 24px;
            background: var(--dgo-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 50px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            font-weight: 800;
        }

        h2::before {
            content: "";
            width: 12px;
            height: 12px;
            background: var(--dgo-red);
            border-radius: 50%;
            margin-right: 15px;
        }

        /* TABLE THEME */
        .table-card {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #eef2f6;
            margin: 30px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            color: var(--dgo-purple);
            padding: 20px;
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #f1f5f9;
        }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        .val-npr { font-weight: 700; color: var(--text-main); }
        .actual-cost { color: #10b981; font-weight: 800; }

        .total-highlight {
            background: var(--dgo-gradient);
            color: white !important;
            font-weight: 800;
            font-size: 18px;
        }

        /* NEWS TABS (SQUARE TILES) */
        .news-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .tab-tile {
